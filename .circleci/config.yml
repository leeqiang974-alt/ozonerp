version: 2.1

jobs:
  build_and_test:
    docker:
      - image: cimg/node:20.11
    steps:
      - checkout
      - run:
          name: Install
          command: npm ci
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Unit Test
          command: npm test
      - run:
          name: Smoke Test
          command: |
            node src/server.js > /tmp/erp-server.log 2>&1 &
            sleep 3
            npm run smoke

workflows:
  version: 2
  staging_gate:
    jobs:
      - build_and_test

