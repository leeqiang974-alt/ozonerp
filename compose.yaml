services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ozon_erp
      POSTGRES_USER: ozon_erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    ports:
      - "5432:5432"
    volumes:
      - ozon_erp_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ozon_erp -d ozon_erp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ozon_erp_postgres:
